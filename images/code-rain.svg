<svg width="1000" height="520" viewBox="0 0 1000 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Full cyberpunk code rain animation</title>
  <desc id="desc">A full-width neon cyberpunk code rain animation with glowing grid lines and falling programming text across the whole banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03040B"/>
      <stop offset="0.42" stop-color="#061323"/>
      <stop offset="0.72" stop-color="#10051F"/>
      <stop offset="1" stop-color="#04120E"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#FF2BD6"/>
      <stop offset="0.78" stop-color="#00FF85"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spotA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 110) rotate(58) scale(250 180)">
      <stop stop-color="#00F5FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(805 370) rotate(41) scale(300 210)">
      <stop stop-color="#FF2BD6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#00F5FF" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <style>
      .rain {
        font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
        font-size: 18px;
        fill: #00ff85;
        opacity: .82;
        text-shadow: 0 0 8px #00ff85, 0 0 18px #00f5ff;
        animation: fall 7s linear infinite;
      }
      .cyan {
        fill: #00f5ff;
        opacity: .72;
        animation-duration: 9s;
      }
      .pink {
        fill: #ff2bd6;
        opacity: .58;
        animation-duration: 11s;
      }
      .dim {
        opacity: .42;
        animation-duration: 13s;
      }
      .delay1 { animation-delay: -1.1s; }
      .delay2 { animation-delay: -2.4s; }
      .delay3 { animation-delay: -3.7s; }
      .delay4 { animation-delay: -5.2s; }
      .delay5 { animation-delay: -6.6s; }
      .delay6 { animation-delay: -8s; }
      .scan {
        animation: scan 5.5s ease-in-out infinite;
      }
      @keyframes fall {
        from { transform: translateY(-620px); }
        to { transform: translateY(620px); }
      }
      @keyframes scan {
        0%, 100% { transform: translateY(-90px); opacity: 0; }
        45%, 60% { opacity: .95; }
        100% { transform: translateY(430px); }
      }
    </style>
  </defs>

  <rect width="1000" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="520" rx="24" fill="url(#grid)"/>
  <rect width="1000" height="520" rx="24" fill="url(#spotA)"/>
  <rect width="1000" height="520" rx="24" fill="url(#spotB)"/>

  <path d="M0 92H1000" stroke="url(#neon)" stroke-width="1.5" opacity=".55" filter="url(#glow)"/>
  <path d="M0 260H1000" stroke="url(#neon)" stroke-width="2.2" opacity=".68" filter="url(#glow)"/>
  <path d="M0 430H1000" stroke="url(#neon)" stroke-width="1.5" opacity=".45" filter="url(#glow)"/>
  <path class="scan" d="M45 76H955" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>

  <g>
    <text class="rain delay1" x="18" y="40">10110</text>
    <text class="rain cyan delay4" x="55" y="-65">const</text>
    <text class="rain pink delay2" x="92" y="85">0101</text>
    <text class="rain delay6" x="130" y="-120">async</text>
    <text class="rain cyan delay3" x="168" y="18">return</text>
    <text class="rain dim delay5" x="206" y="-42">npm</text>
    <text class="rain pink delay1" x="244" y="110">&lt;/&gt;</text>
    <text class="rain delay4" x="282" y="-88">push</text>
    <text class="rain cyan delay2" x="320" y="62">01001</text>
    <text class="rain pink delay6" x="358" y="-18">git</text>
    <text class="rain delay3" x="396" y="128">code</text>
    <text class="rain cyan delay5" x="434" y="-146">while</text>
    <text class="rain pink delay2" x="472" y="22">dev</text>
    <text class="rain dim delay1" x="510" y="-78">101</text>
    <text class="rain cyan delay6" x="548" y="98">function</text>
    <text class="rain delay4" x="586" y="-34">build</text>
    <text class="rain pink delay5" x="624" y="148">01</text>
    <text class="rain cyan delay1" x="662" y="-112">mysql</text>
    <text class="rain delay3" x="700" y="50">script</text>
    <text class="rain dim delay2" x="738" y="-8">commit</text>
    <text class="rain pink delay4" x="776" y="118">css</text>
    <text class="rain cyan delay5" x="814" y="-92">html</text>
    <text class="rain delay2" x="852" y="28">array</text>
    <text class="rain pink delay6" x="890" y="-52">php</text>
    <text class="rain cyan delay3" x="928" y="88">true</text>
    <text class="rain delay1" x="966" y="-130">{}</text>
  </g>

  <g opacity=".78">
    <text class="rain cyan delay5" x="34" y="-245">deploy</text>
    <text class="rain pink delay3" x="116" y="-280">fetch</text>
    <text class="rain delay2" x="198" y="-215">0010</text>
    <text class="rain cyan delay6" x="280" y="-260">branch</text>
    <text class="rain pink delay1" x="362" y="-230">merge</text>
    <text class="rain delay4" x="444" y="-300">01011</text>
    <text class="rain cyan delay2" x="526" y="-235">debug</text>
    <text class="rain pink delay5" x="608" y="-272">stack</text>
    <text class="rain delay3" x="690" y="-210">logic</text>
    <text class="rain cyan delay1" x="772" y="-292">query</text>
    <text class="rain pink delay4" x="854" y="-224">node</text>
    <text class="rain delay6" x="936" y="-265">var</text>
  </g>

  <g filter="url(#glow)">
    <text x="500" y="252" text-anchor="middle" font-family="Fira Code, Cascadia Code, Consolas, monospace" font-size="32" font-weight="700" fill="#E9FBFF" opacity=".82">HABIB-PRDTR</text>
    <text x="500" y="286" text-anchor="middle" font-family="Fira Code, Cascadia Code, Consolas, monospace" font-size="15" fill="#93F8FF" opacity=".72">CYBERPUNK CODE RAIN // ALWAYS LEARNING</text>
  </g>
</svg>
