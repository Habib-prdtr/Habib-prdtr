<svg width="480" height="195" viewBox="0 0 480 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Habib's coding momentum</title>
  <desc id="desc">A cyberpunk styled coding momentum card for Habib-prdtr.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="480" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".5" stop-color="#11162A"/>
      <stop offset="1" stop-color="#071B18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset=".52" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#00FF85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E9FBFF; }
      .label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8BE9FD; }
      .value { font: 800 34px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00FF85; }
      .small { font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #B6C7D6; }
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="193" rx="12" fill="url(#card)" stroke="#26344D"/>
  <circle cx="402" cy="50" r="56" fill="#FF2BD6" opacity=".13" filter="url(#glow)"/>
  <circle cx="96" cy="145" r="58" fill="#00F5FF" opacity=".13" filter="url(#glow)"/>

  <text x="28" y="35" class="title">Coding Momentum</text>
  <text x="28" y="62" class="small">Consistent learning, building, and improving.</text>

  <g transform="translate(28 88)">
    <text x="0" y="22" class="value">Active</text>
    <text x="0" y="48" class="label">Open source • freelance • practice projects</text>
  </g>

  <g transform="translate(28 152)" filter="url(#glow)">
    <rect width="424" height="12" rx="6" fill="#111827"/>
    <rect width="390" height="12" rx="6" fill="url(#bar)"/>
  </g>

  <g transform="translate(28 176)">
    <text x="0" y="0" class="small">Learn</text>
    <text x="124" y="0" class="small">Build</text>
    <text x="248" y="0" class="small">Ship</text>
    <text x="372" y="0" class="small">Repeat</text>
  </g>
</svg>
