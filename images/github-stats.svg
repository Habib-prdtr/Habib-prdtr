<svg width="480" height="195" viewBox="0 0 480 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Habib's GitHub profile overview</title>
  <desc id="desc">A cyberpunk styled GitHub profile overview card for Habib-prdtr.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="480" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset=".58" stop-color="#071524"/>
      <stop offset="1" stop-color="#14071E"/>
    </linearGradient>
    <linearGradient id="line" x1="28" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF"/>
      <stop offset=".5" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#00FF85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E9FBFF; }
      .label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8BE9FD; }
      .value { font: 700 20px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00FF85; }
      .small { font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #B6C7D6; }
      .chip { font: 700 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #031014; }
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="193" rx="12" fill="url(#card)" stroke="#26344D"/>
  <path d="M28 48H452" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="420" cy="35" r="42" fill="#00F5FF" opacity=".12" filter="url(#glow)"/>
  <circle cx="72" cy="158" r="48" fill="#FF2BD6" opacity=".12" filter="url(#glow)"/>

  <text x="28" y="34" class="title">Habib-prdtr</text>
  <text x="28" y="74" class="small">Coding with passion, learning with purpose</text>

  <g transform="translate(28 96)">
    <rect width="126" height="58" rx="10" fill="#071C2A" stroke="#173B52"/>
    <text x="16" y="23" class="label">Focus</text>
    <text x="16" y="47" class="value">Web Dev</text>
  </g>
  <g transform="translate(177 96)">
    <rect width="126" height="58" rx="10" fill="#10152B" stroke="#2B315A"/>
    <text x="16" y="23" class="label">Status</text>
    <text x="16" y="47" class="value">Learning</text>
  </g>
  <g transform="translate(326 96)">
    <rect width="126" height="58" rx="10" fill="#0E1D18" stroke="#244B3E"/>
    <text x="16" y="23" class="label">Open For</text>
    <text x="16" y="47" class="value">Collab</text>
  </g>

  <g transform="translate(28 168)">
    <rect width="52" height="18" rx="9" fill="#00F5FF"/>
    <text x="13" y="13" class="chip">HTML</text>
    <rect x="62" width="44" height="18" rx="9" fill="#00FF85"/>
    <text x="75" y="13" class="chip">CSS</text>
    <rect x="116" width="78" height="18" rx="9" fill="#FF2BD6"/>
    <text x="131" y="13" class="chip">JavaScript</text>
    <rect x="204" width="42" height="18" rx="9" fill="#8BE9FD"/>
    <text x="217" y="13" class="chip">PHP</text>
    <rect x="256" width="58" height="18" rx="9" fill="#00FF85"/>
    <text x="271" y="13" class="chip">MySQL</text>
  </g>
</svg>
